    box-sizing:border-box;

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0b5d3b,#16804f);
    color:white;
    text-align:center;
    padding:35px 15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.icon{
    font-size:55px;
    margin-bottom:10px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;

header p{

.container{
    max-width:850px;

.back{

.title{
    text-align:center;
    color:#0b5d3b;
    font-size:28px;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    border:1px solid #e5eee8;
}

.card-icon{
    font-size:55px;
    margin-bottom:15px;
}

.card h2{
    color:#0b5d3b;
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.8;
    margin-bottom:15px;
}

.number{
    font-size:20px;
    font-weight:bold;
    color:#333;
    direction:ltr;
    margin-bottom:18px;
}

.whatsapp{
    display:inline-block;
    background:#0b5d3b;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:bold;
}

.whatsapp:hover{
    background:#084a2f;
}

footer{
    background:#083f29;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:60px;
    line-height:1.8;
}

@media(max-width:600px){

    .cards{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:27px;
    }

}

</style>

</head>
