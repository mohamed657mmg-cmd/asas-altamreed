body{

header{
    background:linear-gradient(135deg,#0b5d3b,#16804f);
    color:white;
    text-align:center;
    padding:35px 15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.icon{

header h1{

.sections{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.section{
    background:white;
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    border:1px solid #e5eee8;
    transition:.2s;
}

.section:hover{
    transform:translateY(-4px);
}

.section-icon{
    font-size:55px;
    margin-bottom:15px;
}

.section h2{
    color:#0b5d3b;
    margin-bottom:10px;
}

.section p{
    color:#666;
    line-height:1.7;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    background:#0b5d3b;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:bold;
}

.btn:hover{
    background:#084a2f;
}

footer{
    background:#083f29;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:60px;
    line-height:1.8;
}

@media(max-width:600px){

    .sections{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:27px;
    }

}

</style>
